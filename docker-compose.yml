networks:
  web:
    external: true

services:
  backend:
    build: ./src/Backend
    networks:
    - web
    expose:
    - "80"
    env_file:
    - config.env
    volumes:
    - ./keys:/private:ro
    labels:
    - "traefik.enable=true"
    - "traefik.docker.network=web"

    # HTTPS router
    - "traefik.http.routers.wom-codymaze.rule=Host(`codymaze.wom.social`)"
    - "traefik.http.routers.wom-codymaze.entrypoints=websecure"
